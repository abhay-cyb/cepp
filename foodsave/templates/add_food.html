{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <h2>Add Food Item</h2>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('add_food') }}">
        <div class="form-group">
            <label for="food_name">Food Name</label>
            <input type="text" id="food_name" name="food_name" class="form-control" required placeholder="e.g. Milk, Apple, Rice">
        </div>
        
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" class="form-control" required>
                <option value="Fruits">Fruits</option>
                <option value="Vegetables">Vegetables</option>
                <option value="Dairy">Dairy</option>
                <option value="Grains">Grains</option>
                <option value="Meat">Meat</option>
                <option value="Bakery">Bakery</option>
                <option value="Beverages">Beverages</option>
                <option value="Snacks">Snacks</option>
                <option value="Other">Other</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="text" id="quantity" name="quantity" class="form-control" required placeholder="e.g. 2 L, 5 kg, 1 Pack">
        </div>
        
        <div class="form-group">
            <label for="purchase_date">Purchase Date</label>
            <input type="date" id="purchase_date" name="purchase_date" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="expiry_date">Expiry Date</label>
            <input type="date" id="expiry_date" name="expiry_date" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="storage_location">Storage Location</label>
            <select id="storage_location" name="storage_location" class="form-control" required>
                <option value="Refrigerator">Refrigerator</option>
                <option value="Freezer">Freezer</option>
                <option value="Pantry">Pantry</option>
                <option value="Kitchen Shelf">Kitchen Shelf</option>
                <option value="Other">Other</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">Add Food</button>
    </form>
</div>

<script>
    document.getElementById('purchase_date').valueAsDate = new Date();
</script>
{% endblock %}
